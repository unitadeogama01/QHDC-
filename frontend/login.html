<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar — QHDC!</title>
  <link rel="icon" href="img/LOGO.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/auth.css">
  <script src="js/interaccion.js"></script>
</head>
<body>
  <main class="auth">
    <!-- ===== Marca ===== -->
    <section class="auth-marca">
      <a href="index.html" class="logo"><img src="img/LOGO.png" alt="" class="logo-img"><span class="logo-texto">QHDC!</span></a>
      <div>
        <h1>Tu cocina te estaba esperando.</h1>
        <p>Revisa qué hay, qué está por caducar y qué puedes cocinar hoy.</p>
        <div class="estante-auth" aria-hidden="true">
          <div class="frasco" style="--t:62px; --nivel:75%"><span class="tapa"></span><span class="cuerpo"><span class="liquido"></span></span><span class="icono"><i class="fa-solid fa-egg"></i></span></div>
          <div class="frasco medio" style="--t:62px; --nivel:45%"><span class="tapa"></span><span class="cuerpo"><span class="liquido"></span></span><span class="icono"><i class="fa-solid fa-cheese"></i></span></div>
          <div class="frasco" style="--t:62px; --nivel:85%"><span class="tapa"></span><span class="cuerpo"><span class="liquido"></span></span><span class="icono"><i class="fa-solid fa-carrot"></i></span></div>
          <div class="frasco bajo" style="--t:62px; --nivel:20%"><span class="tapa"></span><span class="cuerpo"><span class="liquido"></span></span><span class="icono"><i class="fa-solid fa-bowl-rice"></i></span></div>
        </div>
      </div>
      <small>ARK SYSTEMS · 2026</small>
    </section>

    <!-- ===== Entrar ===== -->
    <section class="auth-form">
      <div class="auth-arriba">
        <a href="index.html" class="volver"><i class="fa-solid fa-arrow-left"></i> Inicio</a>
        <button class="btn-icono" id="btnTema" type="button"></button>
      </div>

      <div class="auth-caja">
        <h2>¿Quién va a cocinar?</h2>
        <p>Elige tu perfil para entrar.</p>

        <div class="perfiles" id="perfiles"></div>

        <form class="form-cuenta oculto" id="formLogin" novalidate>
          <div class="mensaje-error oculto" id="error" role="alert"><i class="fa-solid fa-circle-exclamation"></i><span></span></div>
          <div class="campo">
            <label for="email">Correo</label>
            <div class="control-icono"><i class="fa-solid fa-envelope"></i><input class="control" type="email" id="email" placeholder="tu@correo.com" autocomplete="email"></div>
          </div>
          <div class="campo">
            <label for="password">Contraseña</label>
            <div class="control-icono">
              <i class="fa-solid fa-lock"></i>
              <input class="control con-boton" type="password" id="password" placeholder="••••••••" autocomplete="current-password">
              <button type="button" class="ver-clave" data-para="password" aria-label="Mostrar contraseña" data-sonido="suave"><i class="fa-solid fa-eye"></i></button>
            </div>
          </div>
          <button type="submit" class="btn btn-principal btn-lg btn-bloque" data-sonido="ninguno"><i class="fa-solid fa-right-to-bracket"></i> Entrar</button>
        </form>

        <p class="auth-pie">¿Primera vez? <a href="registro.html">Crea tu cuenta</a></p>
      </div>
    </section>
  </main>

  <script src="js/datos.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
